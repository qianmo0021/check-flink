name: Check Links and Generate JSON

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  check_links:
    runs-on: ubuntu-latest

    steps:
    # -----------------------------
    # 拉取最新仓库
    # -----------------------------
    - name: Pull latest repository
      uses: actions/checkout@v4

    # -----------------------------
    # 缓存 pip 包
    # -----------------------------
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # -----------------------------
    # 安装 Python
    # -----------------------------
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # -----------------------------
    # 安装依赖
    # -----------------------------
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # -----------------------------
    # 调试：检查 projects.json 是否可访问
    # -----------------------------
    - name: Debug: fetch projects.json
      run: |
        echo "DEBUG: 检查 projects.json 内容"
        curl -s https://lxb-blog.pages.dev/projects.json | head -n 20

    # -----------------------------
    # 运行 main.py
    # -----------------------------
    - name: Run main.py
      env:
        PROXY_URL: ${{ secrets.PROXY_URL }}
        SOURCE_URL: ${{ secrets.SOURCE_URL }}
      run: python main.py

    # -----------------------------
    # 运行 main1.py
    # -----------------------------
    - name: Run main1.py
      env:
        SOURCE_URL: https://lxb-blog.pages.dev/projects.json
      run: python main1.py

    # -----------------------------
    # 上传 JSON artifacts
    # -----------------------------
    - name: Upload JSON artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 'json_artifacts'
        path: |
          ./result.json
          ./projects_status.json
        retention-days: 10

    # -----------------------------
    # 推送 result.json 和 projects_status.json 到 static/
    # -----------------------------
    - name: Commit and push JSON files
      run: |
        mkdir -p static
        cp ./result.json ./projects_status.json static/
        cd static
        if [ ! -d ".git" ]; then
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -b page
        fi
        git add result.json projects_status.json
        git commit -m "⏱️GitHub Action每日更新 result.json & projects_status.json" || echo "No changes to commit"
        git push --force origin page

    # -----------------------------
    # 删除旧 workflow runs
    # -----------------------------
    - name: Delete Workflow Runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 30
        keep_minimum_runs: 6

  keepalive-workflow:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: check_links
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
