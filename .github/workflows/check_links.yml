name: Check Links and Generate JSON

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  check_links:
    runs-on: ubuntu-latest

    steps:
    - name: Pull latest repository
      uses: actions/checkout@v4

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 下载上次 result.json artifact
    - name: Download result.json artifact
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        branch: main
        name: 'result_json'
        path: './'
        if_no_artifact_found: warn

    # -----------------------------
    # 调试：打印 projects.json 内容
    # -----------------------------
    - name: Debug: print projects.json content
      run: |
        echo "DEBUG: 检查 projects.json 是否可访问"
        curl -s https://lxb-blog.pages.dev/projects.json | head -n 20

    # 运行 main.py
    - name: Run main.py
      env:
        PROXY_URL: ${{ secrets.PROXY_URL }}
        SOURCE_URL: ${{ secrets.SOURCE_URL }}
      run: python main.py

    # 运行 main1.py
    - name: Run main1.py
      run: python main1.py

    # 上传 artifacts
    - name: Upload JSON artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 'json_artifacts'
        path: |
          ./result.json
          ./projects_status.json
        retention-days: 10

    # 一次性推送两个 JSON 文件到 static/
    - name: Commit and push JSON files
      run: |
        cp ./result.json ./projects_status.json static/
        cd static
        rm -rf .git
        git init
        git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        git checkout -b page
        git add result.json projects_status.json
        git commit -m "⏱️GitHub Action每日更新 result.json & projects_status.json"
        git push --force origin page

    # 删除老的 workflow runs
    - name: Delete Workflow Runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 30
        keep_minimum_runs: 6

  keepalive-workflow:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: check_links
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
